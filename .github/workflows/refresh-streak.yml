name: Refresh contribution streak card

on:
  schedule:
    - cron: "19 */6 * * *"
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "scripts/update-streak.mjs"
      - ".github/workflows/refresh-streak.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v7.0.1
      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Generate streak dashboard
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-streak.mjs
      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak-card.svg
          if git diff --cached --quiet; then
            echo "Streak card is already current."
          else
            git commit -m "Refresh contribution streak card"
            git push
          fi

